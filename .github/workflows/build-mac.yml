name: Build JCEF (macOS)

# Builds the JCEF native distribution (libjcef.dylib + Chromium Embedded
# Framework.framework + Helper apps + jcef.jar) for both Apple Silicon and
# x86_64, and uploads them as release assets.
#
# Windows is built in a separate workflow (.github/workflows/build-windows.yml)
# to keep the per-platform setup steps readable. Both attach to the same
# release tag.
#
# Trigger forms:
#  - Tag push matching v*-ime.* (e.g. v135.0.20-ime.1) → creates a release.
#  - workflow_dispatch with input `version` (no leading v) → uploads to a
#    pre-existing draft release named `v<version>-ime.<n>`.
#
# The "ime.N" suffix in the tag distinguishes our patch revisions from
# upstream CEF version bumps. Bump it whenever the IME patch series changes
# but the underlying CEF version stays the same.

on:
  push:
    tags:
      - 'v*-ime.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach assets to (e.g. v135.0.20-ime.1). Tag must already exist.'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            cef_platform: macosarm64
            dist_platform: macosarm64
          - runner: macos-13
            arch: x64
            cef_platform: macosx64
            dist_platform: macosx64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The CEF binary distribution is large (~700MB compressed) and stable
      # per CEF_VERSION. Cache it across runs to cut build time roughly in
      # half on warm CI.
      - name: Cache CEF distribution
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ matrix.cef_platform }}-135.0.20

      - name: Configure (CMake + Ninja)
        run: |
          brew install ninja
          mkdir -p jcef_build
          cd jcef_build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPROJECT_ARCH=${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }} \
            ..

      - name: Build native
        run: |
          cd jcef_build
          ninja -j$(sysctl -n hw.ncpu)

      # jcef.jar is built by the Ant target invoked from CMake's
      # POST_BUILD step (native/CMakeLists.txt). That path uses build.xml's
      # `target=1.8 source=1.8` setting and produces Java 8 bytecode where
      # `private final native` methods get `invokespecial` dispatch — which
      # is what JCEF's JNI lookup expects.
      #
      # We previously ran `tools/compile.sh` + `tools/make_jar.sh` here,
      # but those use plain javac with the runner's default release (21 on
      # macos-14). Java 21 emits `invokevirtual` for the same call sites
      # and silently breaks key-event dispatch in the embedder.
      #
      # Ensure ant is on PATH. macos-14 runners ship it by default but
      # belt-and-braces.
      - name: Ensure ant is installed
        run: |
          if ! command -v ant >/dev/null 2>&1; then
            brew install ant
          fi
          ant -version

      # Stage the install-dir layout that flex-ax-desktop's KcefBootstrap
      # expects: dylib + framework + helper apps flat at the root.
      - name: Stage install-dir layout
        run: |
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          REL=jcef_build/native/Release
          cp -R "$REL/libjcef.dylib" "$STAGE/"
          cp -R "$REL"/jcef_app.app/Contents/Frameworks/"Chromium Embedded Framework.framework" "$STAGE/"
          for app in "$REL"/jcef_app.app/Contents/Frameworks/jcef\ Helper*.app; do
            cp -R "$app" "$STAGE/"
          done
          ls -la "$STAGE"

      - name: Package tar.gz
        run: |
          STAGE="$RUNNER_TEMP/stage"
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET="jcef-flex-${TAG}-${{ matrix.dist_platform }}.tar.gz"
          # tar runs from $GITHUB_WORKSPACE (the default cwd), so the output
          # lands there directly. No mv needed — the upload step globs from
          # the workspace root.
          tar -C "$STAGE" -czf "$ASSET" .
          shasum -a 256 "$ASSET" | tee "${ASSET}.sha256"

      # Upload jcef.jar only from arm64 — it's the same Java classes on both
      # archs, so we don't need duplicates as release assets.
      #
      # Strip MANIFEST.MF before publishing. The default jar carries
      # `Automatic-Module-Name: jcef`, which makes the JVM promote it to an
      # automatic JPMS module at runtime. That collides with JBR's bundled
      # `jcef.jmod` (different commit, different native ABI) and silently
      # breaks key event dispatch in the embedder. Dropping the manifest
      # keeps everything on the classpath where our exclude rules can take
      # effect deterministically.
      - name: Stage jcef.jar (arm64 only)
        if: matrix.arch == 'arm64'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          SRC="jcef_build/native/Release/jcef.jar"
          DST="jcef-flex-${TAG}.jar"
          cp "$SRC" "$DST"
          # Drop MANIFEST.MF — its Automatic-Module-Name=jcef collides with
          # JBR's bundled jcef.jmod when this jar lands on the classpath of
          # an embedder that runs on JBR.
          zip -d "$DST" META-INF/MANIFEST.MF || true
          shasum -a 256 "$DST" | tee "$DST.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            jcef-flex-*.tar.gz
            jcef-flex-*.tar.gz.sha256
            jcef-flex-*.jar
            jcef-flex-*.jar.sha256
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
